[package]
name = "sile"
version = "1.0.0"
description = "Sile — modern file transfer client"
authors = ["Sile"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
suppaftp = { version = "6", default-features = false, features = ["async", "async-native-tls"] }
native-tls = "0.2"
async-std = "1"
async-native-tls = "0.5"
async-trait = "0.1"
tokio-socks = "0.5"
russh = "0.46"
russh-sftp = "2"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
chrono = "0.4"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
