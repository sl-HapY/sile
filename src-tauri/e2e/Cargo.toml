[package]
name = "sile-e2e"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "fs"] }
russh = "0.46"
russh-sftp = "2"
suppaftp = { version = "6", default-features = false, features = ["async", "async-native-tls"] }
async-native-tls = "0.5"
native-tls = "0.2"
chrono = "0.4"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio-socks = "0.5"
futures = "0.3"
async-trait = "0.1"
async-std = "1"

[[bin]]
name = "sile_e2e"
path = "src/main.rs"
